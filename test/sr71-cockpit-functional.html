<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Original SR-71 cockpit functionality verification</title><style>body{margin:0;background:#111;color:#fff;font:14px system-ui}canvas{display:block}#panel{position:absolute;top:12px;left:12px;max-width:650px;padding:12px;background:#0c1426dd;border:1px solid #6f9bd4}button{background:#1e344e;color:white;border:1px solid #7892af;border-radius:4px;padding:8px;margin:3px;cursor:pointer}button[aria-pressed=true]{background:#387248}h1{font-size:17px;margin:0 0 8px}#state{font-size:12px;white-space:pre-line}p{margin:5px}</style></head><body><div id="panel"><h1>SR-71 • Original cockpit function slice • local verification</h1><p id="loading">Loading original cockpit…</p><div id="lights"></div><button id="level">Level · 321 KEAS / 85,432 ft / M3.21 / heading000</button><button id="climb">Nose up20° / right bank30° / heading090</button><button id="dark">Night inspection</button><button id="all">All lights on / off</button><p id="state"></p><p>Original geometry, clips, emitter positions and mask pixels. Earthwing telemetry; not original WASM systems.</p></div><script>window.addEventListener("error",e=>{document.getElementById("loading").textContent="Browser error: "+e.message});window.addEventListener("unhandledrejection",e=>{document.getElementById("loading").textContent="Browser error: "+e.reason});</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {SR71Cockpit,SR71_COCKPIT_LIGHTS} from '/src/sr71cockpit.js';
import {decompress} from '/src/vendor/fzstd.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color('#172333');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.8;document.body.append(renderer.domElement);
const ambient=new THREE.HemisphereLight(0xc3d7ed,0x303640,1.4);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(0,4,12);scene.add(sun);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.02,100);camera.position.set(0,1.224,13.607);camera.lookAt(0,.9,14.4);
const fdm={out:{eas:321/1.9438444924406046,M:3.21},pos:{y:85432*.3048},quat:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2)};
window.qa={THREE,scene,renderer,camera,fdm,ready:false,errors:[]};
try{
const base='/models/sr71/cockpit/';const json=await (await fetch(base+'cockpit-flight.gltf')).json();const bytes=decompress(new Uint8Array(await (await fetch(base+'cockpit-flight.bin.zst.part00')).arrayBuffer()));
const loader=new GLTFLoader();loader.register(parser=>{parser.loadBuffer=()=>Promise.resolve(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));return {name:'ORIGINAL_LOCAL_BUFFER'};});
const gltf=await loader.parseAsync(JSON.stringify(json),base);const root=gltf.scene;scene.add(root);root.traverse(o=>{if(o.name==='ENVIRONMENT_OCCLUDER')o.visible=false;});const cockpit=new SR71Cockpit({root,animations:gltf.animations});Object.assign(qa,{root,cockpit});
function state(){document.querySelector('#state').textContent='Lamp groups: '+Object.entries(cockpit.state).map(([k,v])=>k.replace('sr71','')+':'+(v?'ON':'off')).join(' · ')+'\n'+(cockpit.missing.length?'Missing: '+cockpit.missing.join(', '):'All 28 functional source clips and 16 source emitter helpers bound.')+'\nUnsupported: analog IAS / Mach / IVSI and traditional barometric altimeter; no fabricated needle calibration.';document.querySelectorAll('[data-light]').forEach(b=>b.setAttribute('aria-pressed',cockpit.state[b.dataset.light]>0));}
const draw=()=>{cockpit.update(fdm,0);renderer.render(scene,camera);state();};qa.draw=draw;
for(const d of SR71_COCKPIT_LIGHTS){const b=document.createElement('button');b.textContent=d.label;b.dataset.light=d.id;b.setAttribute('aria-pressed','false');b.onclick=()=>{cockpit.event(d.id);draw();};document.querySelector('#lights').append(b);}
document.querySelector('#level').onclick=()=>{fdm.quat.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);fdm.out={eas:321/1.9438444924406046,M:3.21};fdm.pos.y=85432*.3048;draw();};
document.querySelector('#climb').onclick=()=>{fdm.quat.setFromAxisAngle(new THREE.Vector3(0,0,1),20*Math.PI/180).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),30*Math.PI/180));fdm.out={eas:456/1.9438444924406046,M:2.46};fdm.pos.y=12345*.3048;draw();};
document.querySelector('#dark').onclick=()=>{ambient.intensity=ambient.intensity>.1?.025:1.4;sun.intensity=sun.intensity>.1?0:2;draw();};
document.querySelector('#all').onclick=()=>{const on=Object.values(cockpit.state).some(v=>v>0);for(const d of SR71_COCKPIT_LIGHTS)cockpit.setLight(d.id,on?0:1);draw();};
renderer.domElement.addEventListener('pointerdown',ev=>{const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(ev.clientX/innerWidth*2-1,1-ev.clientY/innerHeight*2),camera);for(const hit of ray.intersectObjects([...cockpit.hotspots.keys()],true)){for(let n=hit.object;n;n=n.parent){const action=cockpit.hotspots.get(n)?.action;if(action){cockpit.event(action);draw();return;}}}});
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();draw();});
document.querySelector('#loading').textContent='Original flight cockpit loaded • 40 active clips only (518 inactive clips excluded)';qa.ready=true;draw();
}catch(e){qa.errors.push(e.stack);document.querySelector('#loading').textContent=e.message;console.error(e);}
</script></body></html>
